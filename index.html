<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Service Desk - Decision Support Dashboard</title>
    <style>
        /* Modern Corporate Styling */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .dashboard-container { 
            width: 100%;
            max-width: 650px; 
            background: white; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
        }
        h2 { 
            color: #1e293b; 
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 12px; 
        }
        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }
        textarea { 
            width: 100%; 
            height: 130px; 
            padding: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px; 
            resize: none; 
            margin-top: 10px;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        button { 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%; 
            transition: background 0.2s; 
        }
        button:hover { 
            background-color: #1d4ed8; 
        }
        .result-box { 
            margin-top: 30px; 
            padding: 20px; 
            background: #f8fafc; 
            border-left: 5px solid #2563eb; 
            border-radius: 6px; 
            display: none; /* Hidden until a prediction is made */
        }
        .result-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .badge { 
            background: #dbeafe; 
            color: #1e40af; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px;
            display: inline-block;
            margin-top: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2>IT Support Auto-Routing Dashboard</h2>
    <p>Enter the unstructured employee support request description below. The machine learning model will automatically analyze the linguistic tokens and route it to the correct department group.</p>
    
    <textarea id="ticketInput" placeholder="Example: My laptop screen keeps flickering and won't display properly when connected to the office docking station..."></textarea>
    
    <button onclick="classifyTicket()">Analyze & Route Ticket</button>

    <div id="resultBox" class="result-box">
        <div class="result-title">Automated System Action:</div>
        <div>Assigned Department Group: <span id="categoryLabel" class="badge">Processing...</span></div>
    </div>
</div>

<script>
    async function classifyTicket() {
        const rawText = document.getElementById('ticketInput').value;
        
        // Validation check for empty text
        if (!rawText.trim()) {
            alert("Please input support ticket details first.");
            return;
        }

        try {
            // 1. Send asynchronous POST request to your local running Python backend API
            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticket_text: rawText })
            });
            
            const result = await response.json();
            
            // 2. Dynamically update the HTML page layout with your ML model's prediction
            if (result.status === 'success') {
                document.getElementById('categoryLabel').innerText = result.predicted_category;
                document.getElementById('resultBox').style.display = 'block';
            } else {
                alert("Error from server: " + result.message);
            }
        } catch (error) {
            console.error("Error connecting to backend API:", error);
            alert("Could not connect to the backend server. Make sure your app.py is actively running on port 5000!");
        }
    }
</script>

</body>
</html>
